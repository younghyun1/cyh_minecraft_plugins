name: WikiAsk
version: '0.1.3'
main: com.cyhdev.minecraft.ask.WikiAsk
api-version: '26.2'
description: Fast shared per-world Minecraft Wiki chat through a local Codex CLI
commands:
  ask:
    description: Ask a Minecraft question or clear/compact this world's conversation
    usage: /ask <question|clear|compact>
    permission: wikiask.use
permissions:
  wikiask.use:
    description: Ask Minecraft questions using the shared Codex account
    default: true
