[package]
name = "minecraft-wiki-assistant"
version.workspace = true
edition.workspace = true
description = "Local Minecraft Wiki retrieval and bounded Codex chat bridge"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
mimalloc.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "http2", "gzip", "brotli", "zstd", "query", "hickory-dns"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json.workspace = true
tantivy = { version = "0.26.2", default-features = false, features = ["mmap", "lz4-compression", "stemmer", "stopwords"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes", "release_max_level_info"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json"] }
zstd = { version = "0.14.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
