[package]
name = "mc"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
incremental = false
strip = true
panic = "abort"

[profile.dev]
debug = true
panic = "abort"

[dependencies]
flate2 = "1.0.30"
rayon = "1.10.0"
tar = "0.4.40"
walkdir = "2.5.0"
